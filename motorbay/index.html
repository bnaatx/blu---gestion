:root{--bg:#fff;--white:#fff;--navy:#0C093C;--navy-3:#ECECF6;--line:#CFCDE6;--orange:#EE8608;--orange-lite:#FFB25A;--orange-soft:#8F4A00;--ink:#0C093C;--muted:#55527F;--ok:#0B7048;--warn:#8A5200;--bad:#BE2E25;
--display:"Bebas Neue","Arial Narrow",Impact,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:var(--white);border-bottom:3px solid var(--orange);padding-top:env(safe-area-inset-top,0px)}
.head{display:flex;align-items:center;gap:12px;padding-block:10px}
.head img{width:64px;height:64px;object-fit:contain;flex:none}
.head .t{flex:1;min-width:0;font:400 30px/1 var(--display);letter-spacing:1px}
.head .t small{display:block;font:500 12px/1.3 var(--body);letter-spacing:.5px;color:var(--orange-lite)}
.salir{border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:7px 10px;font-size:13px}
main{padding-block:18px 24px;display:flex;flex-direction:column;gap:16px}
h1{font:400 38px/1 var(--display);letter-spacing:.5px;margin:0}
h2{font:400 24px/1.1 var(--display);letter-spacing:.5px;margin:0}
.eyebrow{font-size:12px;color:var(--orange-soft);font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin:0 0 3px}
.lead{color:var(--muted);margin:5px 0 0;font-size:14px}
form,.stack{display:flex;flex-direction:column;gap:14px}
label,.lbl{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input[type=text],input[type=search],input[type=email],input[type=password],input[inputmode=numeric]{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px;font-size:16px;min-height:48px}
input:focus{border-color:var(--orange);outline:none}input::placeholder{color:#716E9B}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;padding:9px 13px;border-radius:6px;font-weight:500;font-size:14px;min-height:42px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--white);border-color:var(--ink);font-weight:700}
.btn{display:block;width:100%;background:var(--orange);color:var(--navy);font:400 24px/1 var(--display);letter-spacing:.8px;padding:13px;border-radius:6px;min-height:50px}
.btn:disabled{background:var(--navy-3);color:var(--muted);cursor:not-allowed}
.btn.small{font-size:21px;padding:10px 12px;min-height:44px}
.btn.alt{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.alt2{background:var(--ink);color:var(--white)}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
form .rowbtns{margin-top:0}
.ghost{border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;font-weight:500;font-size:13px;min-height:42px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:11px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.top>div{min-width:0}
.name{font:400 26px/1 var(--display);letter-spacing:.4px;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--navy-3)}
.rows li:first-child{border-top:0}.rows li>div:first-child{min-width:0;overflow-wrap:anywhere}
.rows li.col{display:block}
.price{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--navy-3);color:var(--muted);white-space:nowrap}
.pill.ok{background:rgba(11,112,72,.12);color:var(--ok)}.pill.warn{background:rgba(238,134,8,.15);color:var(--warn)}.pill.bad{background:rgba(190,46,37,.12);color:var(--bad)}.pill.web{background:rgba(238,134,8,.18);color:var(--orange-soft)}
.link{color:var(--bad);font-size:12px;font-weight:700;text-decoration:underline;padding:6px 0 6px 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions .btn{flex:1 1 150px}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:22px 16px;color:var(--muted);text-align:center}
details summary{cursor:pointer;font-weight:700;padding-block:6px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:4px;font-weight:500;font-size:13px;min-height:36px;flex:1}
.seg button[aria-pressed=true]{background:var(--orange);color:var(--navy);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .bar{display:flex;gap:2px;padding-block:7px}
nav button{flex:1 1 0;min-width:0;padding:8px 1px;min-height:52px;border-radius:6px;overflow:hidden;font:400 17px/1 var(--display);letter-spacing:.4px;color:var(--muted)}
nav button[aria-current=page]{background:var(--orange);color:var(--navy)}
.count{display:block;width:max-content;margin:3px auto 0;font:700 11px/1 var(--body);background:var(--ink);color:#fff;padding:2px 5px;border-radius:9px}
#cartBar:empty{display:none}#cartBar{padding-block:8px 0}
.cartbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--ink);color:#fff;border-radius:6px;padding:11px 14px;font-weight:700;min-height:46px}
.cartbtn span:last-child{color:var(--orange-lite)}
body.concarrito{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:6px;font-weight:700;font-size:18px}
.stepper button:disabled{opacity:.4}.stepper b{min-width:20px;text-align:center}
.back{position:fixed;inset:0;z-index:30;background:rgba(5,4,30,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#fff;border-top:3px solid var(--orange);border-radius:12px 12px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:10px;align-items:center;margin:0;font-weight:400;font-size:15px;flex:1;min-width:0}
.check input{width:21px;height:21px;accent-color:var(--orange);flex:none}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.sum b{font:400 32px/1 var(--display);font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:calc(100% - 32px);max-width:520px;background:var(--ink);color:#fff;font-weight:700;border-radius:6px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.total{background:var(--orange);color:var(--navy);border-radius:8px;padding:16px}
.total p{margin:0;font-weight:700;font-size:13px}.total strong{display:block;font:400 56px/1 var(--display);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.mini b{display:block;font:400 32px/1 var(--display);overflow-wrap:anywhere}.mini span{font-size:12px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:9px;font-size:13px}
.track{height:12px;background:var(--navy-3);border-radius:3px;overflow:hidden}.fill{height:100%;background:var(--orange)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.login img{width:180px;margin:0 auto}
.msg{font-size:14px;color:var(--bad)}
</style>
</head>

const DAY=864e5;
const MEDIOS=['Llave','Nequi','Bancolombia','Davivienda','Tarjeta de crédito'];
const CANALES=['Facebook','WhatsApp','Instagram'];
const money=n=>'$'+Math.round(n).toLocaleString('es-CO');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha=d=>new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const dias=d=>Math.floor((Date.now()-new Date(d))/DAY);
const $=s=>document.querySelector(s);
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

let yo=null,rol=null,nombre='',piezas=[],inv=[],pagos=[],miembros={};
let tab='registrar',sub='pagar',canal='Facebook',tipo='normal',busca='',buscaInv='',invFiltro='todas',ultimoCliente='',formInv=null,carrito={},hoja=null,ocupado=false;
const esJefe=()=>rol==='dueno'||rol==='admin';
const coincide=x=>norm(x.cliente).includes(norm(busca));
const cajaBusca=()=>`<div><label for="busca">Buscar por cliente</label><input id="busca" type="search" placeholder="Nombre del cliente" value="${esc(busca)}"></div>`;

function toast(t){const b=$('#toastBox');b.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',3200)}
function fallo(e){console.error(e);toast('No se pudo guardar. Revisa la conexión e intenta otra vez.')}

/* ---------- Datos ---------- */
const aPieza=r=>({id:r.id,cliente:r.cliente,pieza:r.pieza,precio:r.precio,canal:r.canal,tipo:r.tipo,estado:r.estado,invId:r.inventario_id,abono:r.abono,medio:r.medio,envio:r.envio,guia:r.guia,fechaSep:r.fecha_sep,fechaCas:r.fecha_cas,fechaEnv:r.fecha_env,web:r.canal==='Shopify'});
async function cargar(){
  const hace=new Date(Date.now()-30*DAY).toISOString();
  const [p,i]=await Promise.all([
    sb.from('mb_piezas').select('*').or(`estado.in.(separada,abonada,casillero),fecha_env.gte.${hace}`).order('fecha_sep'),
    sb.from('mb_inventario').select('*').order('nombre')
  ]);
  if(p.error||i.error)throw p.error||i.error;
  piezas=p.data.map(aPieza);
  inv=i.data.map(r=>({id:r.id,nombre:r.nombre,precio:r.precio,unidades:r.unidades,shopify:r.publicado_shopify,origen:r.origen}));
  if(esJefe()){
    const hoy=new Date();hoy.setHours(0,0,0,0);
    const [g,m]=await Promise.all([sb.from('mb_pagos').select('*').gte('fecha',hoy.toISOString()).order('fecha',{ascending:false}),sb.from('mb_miembros').select('user_id,nombre')]);
    if(g.error)throw g.error;
    miembros=Object.fromEntries((m.data||[]).map(x=>[x.user_id,x.nombre]));
    pagos=g.data.map(r=>({monto:r.monto,canal:r.canal,medio:r.medio,quien:miembros[r.registrado_por]||'Web',pieza:r.pieza,cliente:r.cliente}));
  }
}
async function hacer(fn,okMsg){
  if(ocupado)return;ocupado=true;
  try{await fn();await cargar();if(okMsg)toast(okMsg)}catch(e){fallo(e)}finally{ocupado=false;render()}
}
async function moverInv(id,delta){

  const {data,error}=await sb.from('mb_inventario').select('unidades').eq('id',id).single();if(error)throw error;
  const u=Math.max(0,data.unidades+delta);

function abrirHoja(h){hoja=h;pintaHoja()}
function cerrar(){hoja=null;$('#modal').innerHTML=''}
const chipsH=(ops,c)=>`<div class="chips">${ops.map(o=>`<button type="button" class="chip" data-h="${c}" data-v="${o}" aria-pressed="${hoja[c]===o}">${o}</button>`).join('')}</div>`;
function pintaHoja(){
  const h=hoja;let titulo,accion,cuerpo,ok;
  if(h.modo==='carrito'){
    const items=Object.entries(carrito).map(([id,n])=>({x:inv.find(y=>y.id==id),n})).filter(i=>i.x);
    const tot=items.reduce((s,i)=>s+i.x.precio*i.n,0);
    titulo='Carrito';accion='Reportar venta';ok=h.cliente.trim()&&h.medio;
    cuerpo=`<ul class="rows">${items.map(({x,n})=>`<li><div>${esc(x.nombre)}<div class="sub">${money(x.precio)} c/u</div></div><div class="stepper"><button type="button" data-menos="${x.id}" aria-label="Quitar una">−</button><b>${n}</b><button type="button" data-mas="${x.id}" aria-label="Agregar una" ${n<x.unidades?'':'disabled'}>+</button></div></li>`).join('')}</ul>
    <div><label for="cartCliente">Cliente</label><input id="cartCliente" type="text" value="${esc(h.cliente)}" placeholder="Nombre del cliente"></div>
    <div><span class="lbl">Canal</span>${chipsH(CANALES,'canal')}</div><div><span class="lbl">Medio de pago</span>${chipsH(MEDIOS,'medio')}</div>
    <div><span class="lbl">Qué sigue</span>${chipsH(['Casillero','Envío local','Envío nacional'],'destino')}</div><div class="sum"><span>Este pedido</span><b>${money(tot)}</b></div>`;
  }else{
    const sel=h.items,el=sel.filter(x=>h.marcadas.includes(x.id));
    const f=h.modo==='abono'?x=>x.precio/2:h.modo==='saldo'?x=>x.precio-(x.abono||0):x=>x.precio;
    const lista=`<ul class="rows">${sel.map(x=>`<li><label class="check"><input type="checkbox" data-marca="${x.id}" ${h.marcadas.includes(x.id)?'checked':''}>${esc(x.pieza)}</label><span class="price">${money(f(x))}</span></li>`).join('')}</ul>`;
    if(h.modo==='envio'){titulo='Enviar pedido';accion='Confirmar envío';ok=el.length&&h.envio;
      cuerpo=`${lista}<div><span class="lbl">Envío</span>${chipsH(['Local','Nacional'],'envio')}</div><div><label for="guia">Guía (opcional)</label><input id="guia" type="text" value="${esc(h.guia||'')}"></div><div class="sum"><span>Piezas a enviar</span><b>${el.length}</b></div>`;
    }else{titulo=h.modo==='abono'?'Pagó el abono (50 %)':h.modo==='saldo'?'Pagó el resto':'Marcar como vendido';accion=h.modo==='abono'?'Confirmar abono':'Confirmar venta';ok=el.length&&h.medio&&(h.modo==='abono'||h.destino);
      cuerpo=`${lista}<div><span class="lbl">Medio de pago</span>${chipsH(MEDIOS,'medio')}</div>${h.modo!=='abono'?`<div><span class="lbl">Qué sigue</span>${chipsH(['Casillero','Envío local','Envío nacional'],'destino')}</div>`:''}<div class="sum"><span>Este pedido</span><b>${money(el.reduce((s,x)=>s+f(x),0))}</b></div>`;}
  }
  $('#modal').innerHTML=`<div class="back" data-cerrar="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${titulo}"><div class="top"><div><p class="eyebrow">${esc(h.cliente||'')}</p><h1>${titulo}</h1></div><button type="button" class="ghost" data-x="1">Cerrar</button></div>${cuerpo}<button type="button" class="btn" id="okHoja" ${ok?'':'disabled'}>${accion}</button></div></div>`;
}
const destinoCampos=d=>{const n=new Date().toISOString();return d==='Casillero'?{estado:'casillero',fecha_cas:n}:{estado:'enviada',envio:d==='Envío local'?'Local':'Nacional',fecha_env:n}};
async function confirmar(){
  const h=hoja;cerrar();
  if(h.modo==='carrito'){
    const cl=h.cliente.trim(),items=Object.entries(carrito);carrito={};
    return hacer(async()=>{for(const [id,c] of items){const i=inv.find(y=>y.id==id);if(!i)continue;for(let k=0;k<c;k++){
      const x=await nueva({cliente:cl,pieza:i.nombre,precio:i.precio,canal:h.canal,inventario_id:i.id,medio:h.medio,...destinoCampos(h.destino)});
      await pagar(x,i.precio,h.medio);await moverInv(i.id,-1);}}},'Venta reportada para '+cl);
  }
  const el=h.items.filter(x=>h.marcadas.includes(x.id));
  if(h.modo==='envio')return hacer(async()=>{for(const x of el)await upd(x.id,{estado:'enviada',envio:h.envio,guia:h.guia||null,fecha_env:new Date().toISOString()})},'Pedido enviado a '+h.cliente);
  if(h.modo==='nuevo'){const d=h.datos;return hacer(async()=>{
      const x=await nueva({...d,medio:h.medio,...(d.tipo==='preventa'?{estado:'abonada',abono:Math.round(d.precio/2)}:destinoCampos(h.destino))});
      await pagar(x,d.tipo==='preventa'?d.precio/2:d.precio,h.medio,d.tipo==='preventa');await moverInv(d.inventario_id,-1);formInv=null},d.tipo==='preventa'?'Abono registrado':'Vendido. Pasó a ventas');}
  return hacer(async()=>{for(const x of el){
    if(h.modo==='abono'){await pagar(x,x.precio/2,h.medio,true);await upd(x.id,{estado:'abonada',abono:Math.round(x.precio/2),medio:h.medio});}
    else{await pagar(x,h.modo==='saldo'?x.precio-(x.abono||0):x.precio,h.medio);await upd(x.id,{medio:h.medio,...destinoCampos(h.destino)});}
  }},h.modo==='abono'?'Abono registrado':'Vendido. Pasó a ventas');
}

/* ---------- Eventos ---------- */
function conservar(f){const v=['cliente','pieza','precio'].map(i=>$('#'+i)?.value);f();['cliente','pieza','precio'].forEach((i,n)=>{if($('#'+i))$('#'+i).value=v[n]??''})}
function guardaGuia(){const g=$('#guia');if(g&&hoja)hoja.guia=g.value}
function rebusca(id){const e=$('#'+id),p=e.selectionStart;e.focus({preventScroll:true});e.setSelectionRange(p,p)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-cerrar]');if(!t)return;const d=t.dataset;
  if(t.id==='salir'){sb.auth.signOut();return}
  if(d.tab){tab=d.tab;render();scrollTo(0,0);return}
  if(d.sub){sub=d.sub;render();return}
  if(d.canal){canal=d.canal;conservar(vReg);return}
  if(d.tipo){tipo=d.tipo;conservar(vReg);return}
  if(d.invf){invFiltro=d.invf;render();return}
  if(d.liberar){const x=piezas.find(y=>y.id==d.liberar);return hacer(async()=>{
    await upd(x.id,{estado:'liberada',fecha_lib:new Date().toISOString(),liberado_por:yo});
    if(x.invId)await moverInv(x.invId,1);else{const r=await sb.from('mb_inventario').insert({nombre:x.pieza,precio:x.precio,unidades:1,origen:'Liberada'});if(r.error)throw r.error}
  },x.pieza+' volvió al inventario')}
  if(d.vender){const x=piezas.find(y=>y.id==d.vender);abrirHoja({modo:'total',cliente:x.cliente,items:[x],marcadas:[x.id],destino:'Casillero'});return}
  if(d.pagar){const it=porPagar().filter(x=>x.cliente===d.pagar);abrirHoja({modo:'total',cliente:d.pagar,items:it,marcadas:it.map(x=>x.id),destino:'Casillero'});return}
  if(d.prev){const x=piezas.find(y=>y.id==d.prev);abrirHoja({modo:x.estado==='abonada'?'saldo':'abono',cliente:x.cliente,items:[x],marcadas:[x.id],destino:'Casillero'});return}
  if(d.enviar){const it=enCas().filter(x=>x.cliente===d.enviar);abrirHoja({modo:'envio',cliente:d.enviar,items:it,marcadas:it.map(x=>x.id)});return}
  if(d.agregar){const x=inv.find(y=>y.id==d.agregar);carrito[x.id]=(carrito[x.id]||0)+1;toast(x.nombre+' quedó en el carrito');render();return}
  if(d.usar){const x=inv.find(y=>y.id==d.usar);tab='registrar';render();scrollTo(0,0);$('#pieza').value=x.nombre;$('#precio').value=x.precio.toLocaleString('es-CO');$('#cliente').value='';formInv=x.id;$('#cliente').focus();return}
  if(t.id==='verCarrito'){abrirHoja({modo:'carrito',cliente:'',canal,medio:'',destino:'Casillero'});return}
  if(d.mas){carrito[d.mas]++;pintaHoja();return}
  if(d.menos){carrito[d.menos]--;if(!carrito[d.menos])delete carrito[d.menos];if(enCarrito())pintaHoja();else cerrar();render();return}
  if(d.h){guardaGuia();hoja[d.h]=d.v;pintaHoja();return}
  if(d.x||(d.cerrar&&e.target===t)){cerrar();return}
  if(t.id==='okHoja'){guardaGuia();confirmar();return}
});
document.addEventListener('change',e=>{const m=e.target.dataset.marca;if(m){guardaGuia();const id=+m;hoja.marcadas=e.target.checked?[...hoja.marcadas,id]:hoja.marcadas.filter(x=>x!==id);pintaHoja()}});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='busca'){busca=e.target.value;if(tab==='registrar')conservar(render);else render();rebusca('busca')}
  if(id==='buscaInv'){buscaInv=e.target.value;render();rebusca('buscaInv')}
  if(id==='cartCliente'){hoja.cliente=e.target.value;$('#okHoja').disabled=!(hoja.cliente.trim()&&hoja.medio)}
  if(['precio','iPre','iUni'].includes(id)){const n=e.target.value.replace(/\D/g,'');e.target.value=n?Number(n).toLocaleString('es-CO'):''}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='fLogin'){
    const email=$('#lEmail').value.trim(),password=$('#lPass').value,crear=e.submitter?.id==='bCrear';
    const r=crear?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
    if(r.error)return vLogin(crear?'No se pudo crear la cuenta: '+r.error.message:'Correo o contraseña incorrectos.');
    if(crear&&!r.data.session)return vLogin('Revisa tu correo para confirmar la cuenta y luego entra.');
    return;
  }
  if(f==='fInv'){const nom=$('#iNom').value.trim(),pre=+$('#iPre').value.replace(/\D/g,''),uni=+$('#iUni').value.replace(/\D/g,'');if(!nom||!pre||!uni)return toast('Falta la pieza, el precio o las unidades');
    return hacer(async()=>{const r=await sb.from('mb_inventario').insert({nombre:nom,precio:pre,unidades:uni,origen:'Agregada a mano'});if(r.error)throw r.error},nom+' quedó en el inventario')}
  if(f!=='fReg')return;
  const cliente=$('#cliente').value.trim(),pieza=$('#pieza').value.trim(),precio=+$('#precio').value.replace(/\D/g,'');
  if(!cliente||!pieza||!precio)return toast('Falta el cliente, la pieza o el precio');
  ultimoCliente=cliente;const datos={cliente,pieza,precio,canal,tipo,inventario_id:formInv};
  if(e.submitter?.id==='btnVender')return abrirHoja({modo:'nuevo',cliente,datos,items:[{id:0,pieza,precio}],marcadas:[0],destino:'Casillero'});
  hacer(async()=>{await nueva(datos);await moverInv(formInv,-1);formInv=null},tipo==='preventa'?'Preventa registrada para '+cliente:'Separada para '+cliente+'. Tiene 4 días para pagar');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&hoja)cerrar()});

/* ---------- Sesión ---------- */
async function iniciar(session){
  if(!session){yo=rol=null;return vLogin()}
  yo=session.user.id;
  const r=await sb.from('mb_miembros').select('nombre,rol').eq('user_id',yo).maybeSingle();
  if(!r.data){rol=null;return vSinAcceso()}
  rol=r.data.rol;nombre=r.data.nombre;
  try{await cargar()}catch(e){fallo(e)}
  render();
}
sb.auth.onAuthStateChange((_ev,s)=>{setTimeout(()=>iniciar(s),0)});
setInterval(()=>{if(rol&&!hoja&&!ocupado&&document.visibilityState==='visible'&&!document.activeElement?.matches('input'))cargar().then(render).catch(()=>{})},60000);
</script>
</body>
</html>
